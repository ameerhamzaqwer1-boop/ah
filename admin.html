<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Owner Login — AH Kitchen Appliances</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-shell">

<!-- ===== Login Screen ===== -->
<div class="admin-login" id="loginScreen">
  <div style="text-align:center;margin-bottom:20px;">
    <img src="assets/logo.png" alt="Logo" style="height:60px;margin:0 auto 10px;" />
  </div>
  <h2>Owner Login</h2>
  <p style="color:#8a8478;font-size:0.85rem;margin-top:-8px;">Sirf store owner ke liye</p>
  <div id="loginError" class="error-msg" style="display:none;"></div>
  <div class="field">
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="owner@example.com" value="ameerhamzaqwer1@gmail.com" />
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••" />
  </div>
  <button class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;">Login</button>
  <p style="text-align:center;margin-top:18px;"><a href="index.html" style="font-size:0.85rem;color:#9c968a;">← Back to website</a></p>
</div>

<!-- ===== Dashboard ===== -->
<div id="dashboard" style="display:none;">
  <div class="admin-header">
    <div style="display:flex;align-items:center;gap:10px;">
      <img src="assets/logo.png" alt="Logo" style="height:34px;" />
      <strong>AH Kitchen Appliances — Admin</strong>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <a href="index.html" class="mini-btn">View Website</a>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="admin-body">
    <div class="admin-card">
      <h3 id="formTitle" style="margin-top:0;">Add New Product</h3>
      <div class="form-grid">
        <div class="field">
          <label>Product Name</label>
          <input type="text" id="pName" placeholder="e.g. Super National Pressure Cooker 13L" />
        </div>
        <div class="field">
          <label>Price (Rs.)</label>
          <input type="number" id="pPrice" placeholder="e.g. 6500" />
        </div>
        <div class="field">
          <label>Category</label>
          <input type="text" id="pCategory" placeholder="e.g. Cookware" list="categorySuggestions" />
          <datalist id="categorySuggestions"></datalist>
        </div>
        <div class="field">
          <label>Image URL</label>
          <input type="text" id="pImage" placeholder="assets/images/your-photo.jpg or full https:// link" />
        </div>
        <div class="field full">
          <label>Description</label>
          <textarea id="pDescription" placeholder="Product ki tafseel yahan likhein..."></textarea>
        </div>
        <div class="field">
          <label><input type="checkbox" id="pTrending" style="width:auto;margin-right:8px;" />Show in Trending Carousel</label>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:10px;">
        <button class="btn btn-primary" id="saveBtn">Save Product</button>
        <button class="btn btn-outline" id="cancelEditBtn" style="display:none;">Cancel Edit</button>
      </div>
    </div>

    <div class="admin-card">
      <h3 style="margin-top:0;">Your Products</h3>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Trending</th><th>Actions</th></tr>
          </thead>
          <tbody id="productsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
